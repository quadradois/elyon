name: CI/CD ELYON

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'current' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend - testes e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        working-directory: pacotes/backend
        run: npx prisma generate

      - name: Type check
        working-directory: pacotes/backend
        run: npx tsc --noEmit

      - name: Verificar fronteiras de arquitetura
        run: npm run test:architecture --workspace @elyon/backend

      - name: Testes unitarios e coverage
        run: npm run test:unit --workspace @elyon/backend -- --runInBand --coverage --collectCoverageFrom='src/agentes/**/*.ts' --collectCoverageFrom='!src/agentes/__tests__/**' --ci
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=4096
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ENCRYPTION_KEY_ID: ci-v1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: pacotes/backend/coverage/
          retention-days: 7

  frontend:
    # Nome preservado porque este contexto e obrigatorio na protecao da main.
    name: Frontend - build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Testes de autenticacao e fronteiras
        run: npm run test:unit --workspace @elyon/frontend

      - name: Build frontend
        run: npm run build --workspace @elyon/frontend
        env:
          VITE_API_URL: https://api.elyon.ia.br

  integration:
    name: Integracao - PostgreSQL e Redis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_DB: elyon_integration
          POSTGRES_USER: elyon_ci
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elyon_ci -d elyon_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://elyon_ci:ci-database-password@localhost:5432/elyon_integration?schema=public
      REDIS_URL: redis://localhost:6379/15
      PRISMA_MIGRATION_TIMEOUT_SECONDS: 300
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENCRYPTION_KEY_ID: ci-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        working-directory: pacotes/backend
        run: npx prisma generate

      - name: Build do backend
        run: npm run build --workspace @elyon/backend

      - name: Preparar banco dedicado pelas migrations oficiais
        working-directory: pacotes/backend
        run: sh ./scripts/prisma-migrate-deploy.sh

      - name: Verificar estado RLS aplicado
        working-directory: pacotes/backend
        run: node dist/scripts/verify-tenant-rls-state.js enabled

      - name: Testar rollback do piloto RLS
        working-directory: pacotes/backend
        run: >-
          npx prisma db execute
          --file prisma/rollbacks/20260714130000_tenant_rls_pilot.sql
          --schema prisma/schema.prisma

      - name: Verificar estado RLS removido
        working-directory: pacotes/backend
        run: node dist/scripts/verify-tenant-rls-state.js disabled

      - name: Reaplicar piloto RLS apos rollback
        working-directory: pacotes/backend
        run: >-
          npx prisma db execute
          --file prisma/migrations/20260714130000_tenant_rls_pilot/migration.sql
          --schema prisma/schema.prisma

      - name: Verificar estado RLS reaplicado
        working-directory: pacotes/backend
        run: node dist/scripts/verify-tenant-rls-state.js enabled

      - name: Testar tenant, replay e Redis reais
        run: npm run test:integration --workspace @elyon/backend

  baseline:
    name: Baseline outbound - caracterizacao
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_DB: elyon_integration
          POSTGRES_USER: elyon_ci
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elyon_ci -d elyon_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://elyon_ci:ci-database-password@localhost:5432/elyon_integration?schema=public
      REDIS_URL: redis://localhost:6379/15
      PRISMA_MIGRATION_TIMEOUT_SECONDS: 300
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENCRYPTION_KEY_ID: ci-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        working-directory: pacotes/backend
        run: npx prisma generate
      - name: Build do backend e verificadores
        run: npm run build --workspace @elyon/backend
      - name: Preparar banco efemero
        working-directory: pacotes/backend
        run: sh ./scripts/prisma-migrate-deploy.sh
      - name: Executar baseline completa
        run: timeout 8m npm run test:baseline
      - name: Validar analisador sintetico sem PII
        run: timeout 1m npm run --silent baseline:analyze:synthetic --workspace @elyon/backend > baseline-synthetic.json
      - name: Semear baseline agregada sintetica
        run: npm run baseline:analyze:prepare --workspace @elyon/backend -- apply
      - name: Executar analisador autorizado e provar read-only
        run: BASELINE_ANALYSIS_AUTHORIZED=true timeout 1m npm run --silent baseline:analyze:readonly --workspace @elyon/backend > baseline-authorized.json
      - name: Validar contrato JSON agregado
        run: npm run baseline:analyze:validate --workspace @elyon/backend -- ../../baseline-authorized.json
      - name: Provar fail-closed sem autorizacao
        run: |
          if timeout 1m npm run baseline:analyze:readonly --workspace @elyon/backend; then
            echo "analisador aceitou sessao sem autorizacao" >&2
            exit 1
          fi
      - name: Publicar evidencia sintetica agregada
        uses: actions/upload-artifact@v4
        with:
          name: baseline-synthetic-aggregates
          path: |
            baseline-synthetic.json
            baseline-authorized.json
          retention-days: 7
      - name: Limpar seed agregado
        if: always()
        run: npm run baseline:analyze:prepare --workspace @elyon/backend -- cleanup

  migrations:
    name: Migrations - banco vazio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_DB: elyon_migrations_ci
          POSTGRES_USER: elyon_ci
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elyon_ci -d elyon_migrations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://elyon_ci:ci-database-password@localhost:5432/elyon_migrations_ci?schema=public
      PRISMA_MIGRATION_TIMEOUT_SECONDS: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        working-directory: pacotes/backend
        run: npx prisma generate

      - name: Build do verificador de baseline
        run: npm run build --workspace @elyon/backend

      - name: Aplicar migrations em banco vazio
        working-directory: pacotes/backend
        run: sh ./scripts/prisma-migrate-deploy.sh

      - name: Provar idempotencia do deploy
        working-directory: pacotes/backend
        run: sh ./scripts/prisma-migrate-deploy.sh

      - name: Verificar schema final sem drift
        working-directory: pacotes/backend
        run: >-
          npx prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  compose:
    name: Compose - validacao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DB_PASSWORD: ci-database-password
      REDIS_PASSWORD: ci-redis-password
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENCRYPTION_KEY_ID: ci-v1
      OPENAI_API_KEY: ci-openai-placeholder
      EVOLUTION_API_URL: https://evolution.invalid
      EVOLUTION_GLOBAL_API_KEY: ci-evolution-global-placeholder
      EVOLUTION_TENANT_API_KEY: ci-evolution-tenant-placeholder
      EVOLUTION_TENANT_ID: ci-evolution-tenant-id
      EVOLUTION_WEBHOOK_SOURCE_RANGE: 203.0.113.10/32
      ASAAS_WEBHOOK_TOKEN: ci-asaas-webhook-token-with-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validar scripts de backup e restore
        run: |
          bash -n scripts/ops/backup-offhost-r2.sh
          bash -n scripts/ops/restore-drill-r2.sh
          bash -n scripts/ops/install-offhost-backup.sh
          test -f ops/systemd/elyon-offhost-backup.service
          test -f ops/systemd/elyon-offhost-backup.timer

      - name: Validar runbooks e topologia operacional
        run: bash scripts/ops/verify-runbooks.sh

      - name: Validar configuração e alertas Prometheus
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.13.0
          check config /etc/prometheus/prometheus.yml

      - name: Validar utilitario de copia anonimizada
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            koalaman/shellcheck:v0.10.0 \
            --severity=warning \
            /repo/scripts/ops/create-anonymized-db-copy.sh \
            /repo/pacotes/backend/scripts/prisma-migrate-deploy.sh

  images:
    name: Imagens - build
    needs: [backend, frontend, integration, migrations, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PASSWORD: ci-database-password
      REDIS_PASSWORD: ci-redis-password
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENCRYPTION_KEY_ID: ci-v1
      OPENAI_API_KEY: ci-openai-placeholder
      EVOLUTION_API_URL: https://evolution.invalid
      EVOLUTION_GLOBAL_API_KEY: ci-evolution-global-placeholder
      EVOLUTION_TENANT_API_KEY: ci-evolution-tenant-placeholder
      EVOLUTION_TENANT_ID: ci-evolution-tenant-id
      EVOLUTION_WEBHOOK_SOURCE_RANGE: 203.0.113.10/32
      ASAAS_WEBHOOK_TOKEN: ci-asaas-webhook-token-with-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build das imagens da aplicacao
        run: docker compose -f docker-compose.yml build backend frontend site

  deploy:
    name: Producao - deploy
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [backend, frontend, compose, images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://elyon.ia.br
    concurrency:
      group: elyon-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH restrito
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validar release na VPS
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: >-
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes
          "$DEPLOY_USER@$DEPLOY_HOST" "probe $GITHUB_SHA"

      - name: Deploy do SHA aprovado
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: >-
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes
          "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Smoke test externo
        run: npm run test:smoke
