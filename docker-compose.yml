version: '3.8'

services:
  backend:
    build:
      context: ./pacotes/backend
      dockerfile: Dockerfile
    container_name: elyon_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Conexão com Banco Compartilhado (Infra)
      DATABASE_URL: postgresql://${DB_USER:-elyon_user}:${DB_PASSWORD}@elyon_postgres:5432/${DB_NAME:-elyon}
      REDIS_URL: redis://:${REDIS_PASSWORD}@elyon_redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      MANUS_API_KEY: ${MANUS_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_BUCKET_LOGOS: ${AWS_S3_BUCKET_LOGOS}
      ASSERTIVA_CLIENT_ID: ${ASSERTIVA_CLIENT_ID}
      ASSERTIVA_CLIENT_SECRET: ${ASSERTIVA_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://elyon.quadradois.com.br}
      BACKEND_URL: ${BACKEND_URL:-https://api.elyon.quadradois.com.br}
      # 🆕 Feature Flag para 4 Agentes de Captação
      USAR_ORQUESTRADOR_4_AGENTES: "true"
    networks:
      - elyon_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.elyon.quadradois.com.br`)"
      - "traefik.http.routers.backend.entrypoints=web,websecure"
      # - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.docker.network=elyon_network"

  frontend:
    build:
      context: ./pacotes/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.elyon.quadradois.com.br/api
    container_name: elyon_frontend
    restart: unless-stopped
    networks:
      - elyon_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elyonfront.rule=Host(`elyon.quadradois.com.br`)"
      - "traefik.http.routers.elyonfront.entrypoints=web,websecure"
      # - "traefik.http.routers.elyonfront.tls.certresolver=letsencrypt"
      - "traefik.http.services.elyonfront.loadbalancer.server.port=80"
      - "traefik.docker.network=elyon_network"

  audio_converter:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: elyon_audio_converter
    restart: unless-stopped
    entrypoint: [ "tail", "-f", "/dev/null" ]
    networks:
      - elyon_network

networks:
  elyon_network:
    external: true
