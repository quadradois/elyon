# ============================================
# ELYON - Docker Compose Production
# ============================================
# Uso: docker compose -f docker-compose.yml up -d
# ============================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# ==========================================
# SECRETS (arquivos seguros, não em env vars)
# ==========================================
secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

services:
  # ==========================================
  # BANCO DE DADOS
  # ==========================================
  postgres:
    image: pgvector/pgvector:0.8.0-pg15
    container_name: elyon_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-elyon}
      POSTGRES_USER: ${DB_USER:-elyon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-elyon_user} -d ${DB_NAME:-elyon}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elyon_network

  # ==========================================
  # CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: elyon_redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - elyon_network

  # ==========================================
  # BACKEND API
  # ==========================================
  backend:
    image: elyon-backend:latest
    build:
      context: ./pacotes/backend
      dockerfile: Dockerfile
    container_name: elyon_backend
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./backups/status:/var/lib/elyon-backup:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-elyon_user}:${DB_PASSWORD}@elyon_postgres:5432/${DB_NAME:-elyon}
      REDIS_URL: redis://:${REDIS_PASSWORD}@elyon_redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?Defina ENCRYPTION_KEY_ID}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ENCRYPTION_KEY_PREVIOUS_ID: ${ENCRYPTION_KEY_PREVIOUS_ID:-}
      ENCRYPTION_KEY_LEGACY: ${ENCRYPTION_KEY_LEGACY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      AUTORIZACAO_VENDA_DOC_URL: ${AUTORIZACAO_VENDA_DOC_URL:-}
      AUTORIZACAO_VENDA_DOC_NOME: ${AUTORIZACAO_VENDA_DOC_NOME:-modelo_autorizacao_venda.pdf}
      AUTORIZACAO_VENDA_DOC_CAPTION: ${AUTORIZACAO_VENDA_DOC_CAPTION:-Segue o modelo de autorizacao de venda para voce analisar com calma.}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:?Defina EVOLUTION_API_URL}
      EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:?Defina EVOLUTION_GLOBAL_API_KEY}
      EVOLUTION_TENANT_API_KEY: ${EVOLUTION_TENANT_API_KEY:?Defina EVOLUTION_TENANT_API_KEY}
      EVOLUTION_TENANT_ID: ${EVOLUTION_TENANT_ID:?Defina EVOLUTION_TENANT_ID}
      EVOLUTION_WEBHOOK_SOURCE_RANGE: ${EVOLUTION_WEBHOOK_SOURCE_RANGE:?Defina EVOLUTION_WEBHOOK_SOURCE_RANGE}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?Defina ASAAS_WEBHOOK_TOKEN}
      ASSERTIVA_CLIENT_ID: ${ASSERTIVA_CLIENT_ID}
      ASSERTIVA_CLIENT_SECRET: ${ASSERTIVA_CLIENT_SECRET}
      ASSERTIVA_API_URL: ${ASSERTIVA_API_URL:-https://api.assertivasolucoes.com.br}
      FRONTEND_URL: ${FRONTEND_URL:-https://crm.elyon.ia.br}
      BACKEND_URL: ${BACKEND_URL:-https://api.elyon.ia.br}
      MANUS_API_KEY: ${MANUS_API_KEY}
      MANUS_WEBHOOK_PUBLIC_KEY: ${MANUS_WEBHOOK_PUBLIC_KEY:-}
      MANUS_WEBHOOK_URL: ${MANUS_WEBHOOK_URL:-https://api.elyon.ia.br/webhooks/manus}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_BUCKET_LOGOS: ${AWS_S3_BUCKET_LOGOS}
      USAR_ORQUESTRADOR_4_AGENTES: ${USAR_ORQUESTRADOR_4_AGENTES:-true}
      AGENT_COCKPIT_ENABLED: ${AGENT_COCKPIT_ENABLED:-true}
      LEARNING_BANK_ENABLED: ${LEARNING_BANK_ENABLED:-true}
      TEMPORAL_FACTS_ENABLED: ${TEMPORAL_FACTS_ENABLED:-false}
      PAOL_SHADOW_ENABLED: ${PAOL_SHADOW_ENABLED:-false}
      PAOL_AB_ENABLED: ${PAOL_AB_ENABLED:-false}
      PAOL_AB_TRAFFIC_PERCENT: ${PAOL_AB_TRAFFIC_PERCENT:-10}
      PAOL_EMA_ALPHA: ${PAOL_EMA_ALPHA:-0.2}
      PAOL_EXPLORATION_BONUS: ${PAOL_EXPLORATION_BONUS:-0.05}
      MCP_SERVER_ENABLED: ${MCP_SERVER_ENABLED:-false}
      EXPERIENCE_REPLAY_ENABLED: ${EXPERIENCE_REPLAY_ENABLED:-false}
      EXPERIENCE_REPLAY_RECENT_HOURS: ${EXPERIENCE_REPLAY_RECENT_HOURS:-24}
      EXPERIENCE_REPLAY_HISTORICAL_DAYS: ${EXPERIENCE_REPLAY_HISTORICAL_DAYS:-90}
      EXPERIENCE_REPLAY_RECENT_SAMPLE: ${EXPERIENCE_REPLAY_RECENT_SAMPLE:-150}
      EXPERIENCE_REPLAY_HISTORICAL_SAMPLE: ${EXPERIENCE_REPLAY_HISTORICAL_SAMPLE:-120}
      EXPERIENCE_REPLAY_HISTORICAL_POOL: ${EXPERIENCE_REPLAY_HISTORICAL_POOL:-1200}
      EXPERIENCE_REPLAY_RECENT_RATE: ${EXPERIENCE_REPLAY_RECENT_RATE:-0.14}
      EXPERIENCE_REPLAY_HISTORICAL_RATE: ${EXPERIENCE_REPLAY_HISTORICAL_RATE:-0.05}
      EXPERIENCE_REPLAY_MAX_ADJUSTMENT_PER_PATTERN: ${EXPERIENCE_REPLAY_MAX_ADJUSTMENT_PER_PATTERN:-0.12}
      EXPERIENCE_REPLAY_MAX_TOTAL_ADJUSTMENT: ${EXPERIENCE_REPLAY_MAX_TOTAL_ADJUSTMENT:-1.2}
      EXPERIENCE_REPLAY_MIN_ABS_ADJUSTMENT: ${EXPERIENCE_REPLAY_MIN_ABS_ADJUSTMENT:-0.02}
      EXPERIENCE_REPLAY_MAX_PATTERNS: ${EXPERIENCE_REPLAY_MAX_PATTERNS:-60}
      MODO_OUTBOUND_ONLY: ${MODO_OUTBOUND_ONLY:-true}
      DESATIVAR_INBOUND: ${DESATIVAR_INBOUND:-true}
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-1500}

    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - elyon_network
      - crm_quadradois_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elyonapi.rule=Host(`api.elyon.ia.br`)"
      - "traefik.http.routers.elyonapi.entrypoints=websecure"
      - "traefik.http.routers.elyonapi.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elyonapi.service=elyonapi"
      - "traefik.http.routers.elyonapi-evolution-webhook.rule=Host(`api.elyon.ia.br`) && Path(`/webhooks`)"
      - "traefik.http.routers.elyonapi-evolution-webhook.entrypoints=websecure"
      - "traefik.http.routers.elyonapi-evolution-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elyonapi-evolution-webhook.service=elyonapi"
      - "traefik.http.routers.elyonapi-evolution-webhook.priority=100"
      - "traefik.http.routers.elyonapi-evolution-webhook.middlewares=elyon-evolution-webhook-ipallowlist"
      - "traefik.http.middlewares.elyon-evolution-webhook-ipallowlist.ipallowlist.sourcerange=${EVOLUTION_WEBHOOK_SOURCE_RANGE:?Defina EVOLUTION_WEBHOOK_SOURCE_RANGE}"
      - "traefik.http.routers.elyonapi-http.rule=Host(`api.elyon.ia.br`)"
      - "traefik.http.routers.elyonapi-http.entrypoints=web"
      - "traefik.http.routers.elyonapi-http.service=elyonapi"
      - "traefik.http.services.elyonapi.loadbalancer.server.port=3000"
      - "traefik.http.services.elyonapi.loadbalancer.healthcheck.path=/ready"
      - "traefik.http.services.elyonapi.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.elyonapi.loadbalancer.healthcheck.timeout=3s"
      - "traefik.docker.network=elyon_network"

  # ==========================================
  # WORKER DURAVEL (WEBHOOKS + SCHEDULERS)
  # ==========================================
  worker:
    image: elyon-backend:latest
    container_name: elyon_worker
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      WEBHOOK_WORKER_PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-elyon_user}:${DB_PASSWORD}@elyon_postgres:5432/${DB_NAME:-elyon}
      REDIS_URL: redis://:${REDIS_PASSWORD}@elyon_redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?Defina ENCRYPTION_KEY_ID}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ENCRYPTION_KEY_PREVIOUS_ID: ${ENCRYPTION_KEY_PREVIOUS_ID:-}
      ENCRYPTION_KEY_LEGACY: ${ENCRYPTION_KEY_LEGACY:-}
      EVOLUTION_WEBHOOK_SOURCE_RANGE: ${EVOLUTION_WEBHOOK_SOURCE_RANGE:?Defina EVOLUTION_WEBHOOK_SOURCE_RANGE}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?Defina ASAAS_WEBHOOK_TOKEN}
      AGENDA_EFFECTS_ENABLED: ${AGENDA_EFFECTS_ENABLED:-false}
      AGENDA_NO_SHOW_ENABLED: ${AGENDA_NO_SHOW_ENABLED:-false}
      AGENDA_PILOT_TENANT_ID: ${AGENDA_PILOT_TENANT_ID:-}
      AGENDA_PILOT_STARTED_AT: ${AGENDA_PILOT_STARTED_AT:-}
      AGENDA_NO_SHOW_GRACE_MINUTES: ${AGENDA_NO_SHOW_GRACE_MINUTES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - elyon_network

  # ==========================================
  # FRONTEND DASHBOARD
  # ==========================================
  frontend:
    build:
      context: ./pacotes/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_URL:-https://api.elyon.ia.br}
    container_name: elyon_frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - elyon_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elyonfront.rule=Host(`crm.elyon.ia.br`)"
      - "traefik.http.routers.elyonfront.entrypoints=websecure"
      - "traefik.http.routers.elyonfront.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elyonfront.service=elyonfront"
      - "traefik.http.routers.elyonfront-http.rule=Host(`crm.elyon.ia.br`)"
      - "traefik.http.routers.elyonfront-http.entrypoints=web"
      - "traefik.http.routers.elyonfront-http.service=elyonfront"
      - "traefik.http.services.elyonfront.loadbalancer.server.port=80"
      - "traefik.docker.network=elyon_network"

  # ==========================================
  # SITE INSTITUCIONAL
  # ==========================================
  site:
    build:
      context: ./site-quadradois
      dockerfile: Dockerfile
    container_name: elyon_site
    restart: unless-stopped
    logging: *default-logging
    networks:
      - elyon_network
      - crm_quadradois_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site.rule=Host(`elyon.ia.br`) || Host(`www.elyon.ia.br`)"
      - "traefik.http.routers.site.entrypoints=websecure"
      - "traefik.http.routers.site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.site.service=site"
      - "traefik.http.routers.site-http.rule=Host(`elyon.ia.br`) || Host(`www.elyon.ia.br`)"
      - "traefik.http.routers.site-http.entrypoints=web"
      - "traefik.http.routers.site-http.service=site"
      - "traefik.http.services.site.loadbalancer.server.port=80"
      - "traefik.docker.network=elyon_network"

  # ==========================================
  # REVERSE PROXY (Traefik)
  # ==========================================
  traefik:
    image: traefik:v3.3
    container_name: elyon_traefik
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-contato@elyon.ia.br}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - elyon_network
    labels:
      - "traefik.enable=true"
      # Traefik dashboard interno em traefik.elyon.ia.br (opcional)
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.elyon.ia.br`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  # ==========================================
  # AUDIO CONVERTER (Evolution)
  # ==========================================
  audio_converter:
    image: atendai/evolution-audio-converter:latest
    container_name: elyon_audio_converter
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 4040
      API_KEY: ${AUDIO_CONVERTER_API_KEY:-elyon_audio_secret}
      ENABLE_TRANSCRIPTION: "true"
      TRANSCRIPTION_PROVIDER: "openai"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRANSCRIPTION_LANGUAGE: "pt"
    networks:
      - elyon_network

  # ==========================================
  # OBSERVABILIDADE INTERNA
  # ==========================================
  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: elyon_prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
      - "--config.auto-reload"
      - "--config.auto-reload-interval=30s"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - elyon_network

  # ==========================================
  # BACKUP AUTOMATIZADO
  # ==========================================
  backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: elyon_backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_HOST: elyon_postgres
      POSTGRES_DB: ${DB_NAME:-elyon}
      POSTGRES_USER: ${DB_USER:-elyon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      SCHEDULE: "0 3 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups:/backups
    networks:
      - elyon_network
    depends_on:
      postgres:
        condition: service_healthy

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
  redis_data:
  traefik_letsencrypt:
  prometheus_data:

    # ==========================================
    # NETWORKS
    # ==========================================
networks:
  elyon_network:
    external: true
    name: elyon_network

  crm_quadradois_net:
    external: true
