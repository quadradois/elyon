# ============================================
# ELYON - Docker Compose Production (Hardened)
# ============================================
# Uso: docker-compose up -d
# ============================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # BANCO DE DADOS
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: elyon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-elyon}
      POSTGRES_USER: ${DB_USER:-elyon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-elyon_user} -d ${DB_NAME:-elyon}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  # ==========================================
  # CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: elyon_redis
    restart: unless-stopped
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  # ==========================================
  # BACKEND API
  # ==========================================
  backend:
    build:
      context: ./pacotes/backend
      dockerfile: Dockerfile
    container_name: elyon_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-elyon_user}:${DB_PASSWORD}@elyon_postgres:5432/${DB_NAME:-elyon}
      REDIS_URL: redis://:${REDIS_PASSWORD}@elyon_redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      NODE_OPTIONS: "--max-old-space-size=768"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-elyon_7de90821_teste}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASSERTIVA_CLIENT_ID: ${ASSERTIVA_CLIENT_ID}
      ASSERTIVA_CLIENT_SECRET: ${ASSERTIVA_CLIENT_SECRET}
      ASSERTIVA_API_URL: ${ASSERTIVA_API_URL:-https://api.assertivasolucoes.com.br}
      FRONTEND_URL: ${FRONTEND_URL:-https://crm.elyon.ia.br}
      BACKEND_URL: ${BACKEND_URL:-https://api.elyon.ia.br}
      USAR_ORQUESTRADOR_4_AGENTES: 'true'

    networks:
      - elyon_network
      - crm_quadradois_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elyonbackend.rule=Host(`api.elyon.ia.br`)"
      - "traefik.http.routers.elyonbackend.entrypoints=websecure"
      - "traefik.http.routers.elyonbackend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elyonbackend.service=elyonbackend"
      - "traefik.http.services.elyonbackend.loadbalancer.server.port=3000"
      # Sticky sessions para WebSocket
      - "traefik.http.services.elyonbackend.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.elyonbackend.loadbalancer.sticky.cookie.name=elyon_sticky"
      # Middleware para Headers WebSocket
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.elyonbackend.middlewares=sslheader"
      - "traefik.docker.network=elyon_network"

  # ==========================================
  # FRONTEND DASHBOARD
  # ==========================================
  frontend:
    build:
      context: ./pacotes/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_URL:-https://api.elyon.ia.br}
    container_name: elyon_frontend
    restart: unless-stopped
    networks:
      - elyon_network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elyonfront.rule=Host(`crm.elyon.ia.br`)"
      - "traefik.http.routers.elyonfront.entrypoints=websecure"
      - "traefik.http.routers.elyonfront.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elyonfront.service=elyonfront"
      - "traefik.http.routers.elyonfront-http.rule=Host(`crm.elyon.ia.br`)"
      - "traefik.http.routers.elyonfront-http.entrypoints=web"
      - "traefik.http.routers.elyonfront-http.service=elyonfront"
      - "traefik.http.services.elyonfront.loadbalancer.server.port=80"
      - "traefik.docker.network=elyon_network"

  # ==========================================
  # SITE INSTITUCIONAL
  # ==========================================
  site:
    build:
      context: ./site-elyon
      dockerfile: Dockerfile
    container_name: elyon_site
    restart: unless-stopped
    networks:
      - elyon_network
      - crm_quadradois_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site.rule=Host(`elyon.ia.br`)"
      - "traefik.http.routers.site.entrypoints=websecure"
      - "traefik.http.routers.site.tls.certresolver=letsencrypt"
      - "traefik.http.services.site.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging

  # ==========================================
  # ADMIN BILLING DASHBOARD
  # ==========================================
  # admin:
  #   build:
  #     context: ./site-quadradois/admin
  #     dockerfile: Dockerfile
  #   container_name: elyon_admin
  #   restart: unless-stopped
  #   networks:
  #     - elyon_network
  #     - crm_quadradois_net
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.admin.rule=Host(`admin.elyon.ia.br`)"
  #     - "traefik.http.routers.admin.entrypoints=websecure"
  #     - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
  #     - "traefik.http.services.admin.loadbalancer.server.port=80"

  # ==========================================
  # SOCKET PROXY (Security)
  # ==========================================
  socket_proxy:
    image: tecnativa/docker-socket-proxy
    container_name: elyon_socket_proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
    networks:
      - elyon_network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    logging: *default-logging

  # ==========================================
  # REVERSE PROXY (Traefik)
  # ==========================================
  traefik:
    image: traefik:latest
    container_name: elyon_traefik
    restart: unless-stopped
    # environment:
    #   - DOCKER_HOST=tcp://elyon_socket_proxy:2375
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # - "--providers.docker.endpoint=tcp://elyon_socket_proxy:2375"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-contato@quadradois.com.br}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
    ports:
      - "80:80"
      - "443:443"
      - "8888:8080"
    volumes:
      - traefik_letsencrypt:/letsencrypt
      - ./logs/traefik:/var/log/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - socket_proxy
    networks:
      - elyon_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      # Traefik dashboard interno em traefik.elyon.ia.br (opcional)
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.elyon.ia.br`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  # ==========================================
  # AUDIO CONVERTER (Evolution)
  # ==========================================
  audio_converter:
    image: atendai/evolution-audio-converter:latest
    container_name: elyon_audio_converter
    restart: unless-stopped
    environment:
      PORT: 4040
      API_KEY: ${AUDIO_CONVERTER_API_KEY:-elyon_audio_secret}
      ENABLE_TRANSCRIPTION: "true"
      TRANSCRIPTION_PROVIDER: "openai"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRANSCRIPTION_LANGUAGE: "pt"
    networks:
      - elyon_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging: *default-logging

  # ==========================================
  # BACKUP AUTOMATIZADO
  # ==========================================
  backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: elyon_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: elyon_postgres
      POSTGRES_DB: ${DB_NAME:-elyon}
      POSTGRES_USER: ${DB_USER:-elyon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      SCHEDULE: "0 3 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups:/backups
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
  redis_data:
  traefik_letsencrypt:

    # ==========================================
    # NETWORKS
    # ==========================================
networks:
  elyon_network:
    external: true
    name: elyon_network

  backend_net:
    internal: true

  crm_quadradois_net:
    external: true
