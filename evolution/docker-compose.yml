version: '3.3'

services:
  evolution_api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.3.6
    restart: always
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=https://evo.elyon.ia.br
      - DOCKER_ENV=true

      # Database - Skip migrations completely (use existing database)
      - DATABASE_ENABLED=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:b5ec391ce6329f29dfffb5d90c40f61c@postgres_evolution:5432/evolution_db?schema=evolution_api
      - DATABASE_CLIENT_NAME=evolution_exchange

      # Redis
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis_evolution:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false

      # Authentication
      - AUTHENTICATION_API_KEY=elyon_global_secret_key_2025
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # Logs
      - LOG_LEVEL=ERROR
      - LOG_COLOR=true
      - LOG_BAILEYS=error

      # Webhook
      - WEBHOOK_GLOBAL_URL=http://elyon_backend:3000/webhooks
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_BASE64=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_SET=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=false
      - WEBHOOK_EVENTS_MESSAGES_DELETE=false
      - WEBHOOK_EVENTS_SEND_MESSAGE=true
      - WEBHOOK_EVENTS_CONTACTS_SET=false
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=false
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=false
      - WEBHOOK_EVENTS_PRESENCE_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_SET=false
      - WEBHOOK_EVENTS_CHATS_UPSERT=false
      - WEBHOOK_EVENTS_CHATS_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_DELETE=false
      - WEBHOOK_EVENTS_GROUPS_UPSERT=false
      - WEBHOOK_EVENTS_GROUPS_UPDATE=false
      - WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE=false
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_CALL=false

    depends_on:
      - postgres_evolution
      - redis_evolution
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - elyon_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution-api.rule=Host(`evo.elyon.ia.br`)"
      - "traefik.http.routers.evolution-api.entrypoints=web,websecure"
      - "traefik.http.routers.evolution-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.evolution-api.loadbalancer.server.port=8080"
      - "traefik.docker.network=elyon_network"

  postgres_evolution:
    container_name: postgres_evolution
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=b5ec391ce6329f29dfffb5d90c40f61c
      - POSTGRES_DB=evolution_db
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - elyon_network

  redis_evolution:
    container_name: redis_evolution
    image: redis:7-alpine
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - evolution_redis_data:/data
    networks:
      - elyon_network

volumes:
  evolution_instances:
    external: true
    name: evolution-api_evolution_instances
  evolution_postgres_data:
    external: true
    name: evolution-api_postgres_data
  evolution_redis_data:
    external: true
    name: evolution-api_evolution_redis

networks:
  elyon_network:
    external: true
