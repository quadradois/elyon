# ============================================
# ELYON - Docker Compose Production
# ============================================
# Uso: docker-compose -f docker-compose.prod.yml up -d
# ============================================

services:
  # ==========================================
  # BANCO DE DADOS
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: elyon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-elyon}
      POSTGRES_USER: ${DB_USER:-elyon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-elyon_user} -d ${DB_NAME:-elyon}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elyon_network

  # ==========================================
  # CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: elyon_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - elyon_network

  # ==========================================
  # BACKEND API
  # ==========================================
  backend:
    build:
      context: ./pacotes/backend
      dockerfile: Dockerfile
    container_name: elyon_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-elyon_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-elyon}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-https://elyon.quadradois.com.br}
      BACKEND_URL: ${BACKEND_URL:-https://api.elyon.quadradois.com.br}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elyon_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.elyon.quadradois.com.br`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  # ==========================================
  # FRONTEND DASHBOARD
  # ==========================================
  frontend:
    build:
      context: ./pacotes/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_URL:-https://api.elyon.quadradois.com.br}
    container_name: elyon_frontend
    restart: unless-stopped
    networks:
      - elyon_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`elyon.quadradois.com.br`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # ==========================================
  # ADMIN BILLING DASHBOARD
  # ==========================================
  admin:
    build:
      context: ./site-quadradois/admin
      dockerfile: Dockerfile
    container_name: elyon_admin
    restart: unless-stopped
    networks:
      - elyon_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.quadradois.com.br`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

  # ==========================================
  # REVERSE PROXY (Traefik)
  # ==========================================
  traefik:
    image: traefik:v3.0
    container_name: elyon_traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-contato@quadradois.com.br}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - elyon_network
    labels:
      - "traefik.enable=true"
      # Traefik dashboard interno em traefik.quadradois.com.br (opcional)
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.quadradois.com.br`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  # ==========================================
  # AUDIO CONVERTER (Evolution)
  # ==========================================
  audio_converter:
    image: atendai/evolution-audio-converter:latest
    container_name: elyon_audio_converter
    restart: unless-stopped
    environment:
      PORT: 4040
      API_KEY: ${AUDIO_CONVERTER_API_KEY:-elyon_audio_secret}
      ENABLE_TRANSCRIPTION: "true"
      TRANSCRIPTION_PROVIDER: "openai"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRANSCRIPTION_LANGUAGE: "pt"
    networks:
      - elyon_network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
  redis_data:
  traefik_letsencrypt:

    # ==========================================
    # NETWORKS
    # ==========================================
networks:
  elyon_network:
    driver: bridge
