# ==========================================
# ELYON - Postgres Custom Config (Optimization)
# ==========================================

# Memory Configuration (Target: 1GB RAM Container)
listen_addresses = '*'                  # Allow connections from other containers
shared_buffers = 256MB                  # 25% of RAM
effective_cache_size = 768MB            # 75% of RAM (OS Cache + Shared Buffers)
maintenance_work_mem = 64MB             # For maintenance tasks (VACUUM, CREATE INDEX)
work_mem = 4MB                          # Memory per operation/connection

# Checkpoints & WAL
checkpoint_completion_target = 0.9      # Spread checkpoint I/O
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Connections
max_connections = 100                   # Moderate connection limit

# Query Planning
random_page_cost = 1.1                  # SSD Storage assumption
effective_io_concurrency = 200          # SSD capabilities
default_statistics_target = 100         # Balance between planner quality and speed

# Logging (Minimal for performance)
log_min_duration_statement = 1000       # Log queries slower than 1s
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'America/Sao_Paulo'
timezone = 'America/Sao_Paulo'
