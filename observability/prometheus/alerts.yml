groups:
  - name: elyon-availability
    rules:
      - alert: ElyonBackendUnavailable
        expr: up{job="elyon-backend"} == 0
        for: 2m
        labels:
          severity: critical
          owner: platform-sre
        annotations:
          summary: Backend ELYON sem coleta de métricas
          description: O Prometheus não consegue acessar o backend há pelo menos 2 minutos.
          runbook: docs/operacao/OBSERVABILIDADE_E_SLO.md#backend-indisponivel

      - alert: ElyonBackendNotReady
        expr: elyon_readiness_status == 0
        for: 2m
        labels:
          severity: critical
          owner: platform-sre
        annotations:
          summary: Backend ELYON fora do balanceamento
          description: PostgreSQL ou Redis permanece indisponível por pelo menos 2 minutos.
          runbook: docs/operacao/OBSERVABILIDADE_E_SLO.md#backend-não-pronto

      - alert: ElyonDependencyNotReady
        expr: elyon_dependency_ready == 0
        for: 2m
        labels:
          severity: critical
          owner: platform-sre
        annotations:
          summary: Dependência crítica do ELYON indisponível
          description: A dependência {{ $labels.dependency }} falhou na verificação de readiness.
          runbook: docs/operacao/OBSERVABILIDADE_E_SLO.md#dependência-indisponível

      - alert: ElyonWorkerUnavailable
        expr: up{job="elyon-worker"} == 0
        for: 2m
        labels:
          severity: critical
          owner: platform-sre
        annotations:
          summary: Worker duravel do ELYON indisponivel
          description: Webhooks e schedulers nao estao sendo processados ha pelo menos 2 minutos.
          runbook: docs/operacao/WEBHOOK_INBOX_WORKER.md#saude-e-observabilidade

      - alert: ElyonWebhookDeadLetter
        expr: elyon_webhook_inbox_events{status="MORTO"} > 0
        for: 1m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Inbox de webhooks possui eventos mortos
          description: Existem {{ $value }} eventos aguardando diagnostico e replay controlado.
          runbook: docs/operacao/WEBHOOK_INBOX_WORKER.md#replay-seguro

  - name: elyon-red-use
    rules:
      - alert: ElyonHighHttpErrorRate
        expr: |
          (
            sum(rate(elyon_http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(elyon_http_requests_total[5m])), 0.001)
          ) > 0.05
          and sum(rate(elyon_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Taxa de erros HTTP acima de 5%
          description: O backend mantém mais de 5% de respostas 5xx há 5 minutos.
          runbook: docs/operacao/OBSERVABILIDADE_E_SLO.md#taxa-de-erros-alta

      - alert: ElyonHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(elyon_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Latência p95 acima de 2 segundos
          description: A latência HTTP p95 permanece acima do objetivo inicial por 10 minutos.
          runbook: docs/operacao/OBSERVABILIDADE_E_SLO.md#latência-alta

      - alert: ElyonHighNodeMemoryUsage
        expr: elyon_process_resident_memory_bytes > 1.5 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Memória residente do Node.js acima de 1,5 GB
          description: O RSS do backend permanece acima de 1,5 GB há 10 minutos.
          runbook: docs/operacao/OBSERVABILIDADE_E_SLO.md#saturação-de-memória

      - alert: ElyonLoginHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(elyon_http_request_duration_seconds_bucket{method="POST",route="/api/auth/login"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Login acima do guardrail de latência
          description: A latência p95 do login permanece acima de 500 ms.
          runbook: docs/operacao/CAPACIDADE_E_FINOPS.md#limite-de-cenário-excedido

      - alert: ElyonLeadsHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(elyon_http_request_duration_seconds_bucket{method="GET",route="/api/leads"}[5m]))
          ) > 0.75
        for: 10m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Listagem de leads acima do guardrail de latência
          description: A latência p95 da listagem de leads permanece acima de 750 ms.
          runbook: docs/operacao/CAPACIDADE_E_FINOPS.md#limite-de-cenário-excedido

      - alert: ElyonWebhookHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(elyon_http_request_duration_seconds_bucket{method="POST",route="/webhooks"}[5m]))
          ) > 3.5
        for: 10m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Entrada de webhook acima do guardrail de latência
          description: A latência p95 da entrada de webhook permanece acima de 3,5 s.
          runbook: docs/operacao/CAPACIDADE_E_FINOPS.md#limite-de-cenário-excedido

      - alert: ElyonEventLoopSaturated
        expr: elyon_nodejs_eventloop_lag_p99_seconds > 0.2
        for: 10m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Event loop do backend saturado
          description: O atraso p99 do event loop permanece acima de 200 ms.
          runbook: docs/operacao/CAPACIDADE_E_FINOPS.md#event-loop-saturado

      - alert: ElyonOrchestratorHighHourlyCost
        expr: increase(elyon_orchestrator_cost_usd_total[1h]) > 5
        for: 5m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Custo horário anormal no orquestrador
          description: O custo estimado do orquestrador ultrapassou US$ 5 em uma hora.
          runbook: docs/operacao/CAPACIDADE_E_FINOPS.md#custo-horário-anormal
