global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: elyon

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: elyon-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:3000

  - job_name: elyon-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:3001
